<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#9E7321"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="50%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0B1B3D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1B3D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Circle Badge Ring -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="250" cy="250" r="222" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="186" fill="none" stroke="rgba(212, 168, 83, 0.4)" stroke-width="1.5"/>

  <!-- Curved Text Path for College Name -->
  <path id="textArcTop" d="M 68,250 A 182,182 0 1,1 432,250" fill="none"/>
  <path id="textArcBottom" d="M 432,250 A 182,182 0 0,1 68,250" fill="none"/>

  <text font-family="'Outfit', 'Cinzel', serif" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="3.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      S. N. PATEL INTER COLLEGE
    </textPath>
  </text>
  
  <text font-family="'Outfit', sans-serif" font-size="16" font-weight="600" fill="#D4A853" letter-spacing="4">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      • ESTD 1994 • EXCELLENCE &amp; INTEGRITY •
    </textPath>
  </text>

  <!-- Inner Shield -->
  <g transform="translate(140, 120)">
    <!-- Shield Outline -->
    <path d="M 110,25 C 170,25 210,5 210,5 C 210,120 185,185 110,235 C 35,185 10,120 10,5 C 10,5 50,25 110,25 Z" 
          fill="#0B1B3D" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Shield Dividing Line & Quarter Fills -->
    <path d="M 110,25 L 110,235" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 10,110 C 60,125 160,125 210,110" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Top Left: Flaming Torch of Wisdom -->
    <g transform="translate(50, 48) scale(0.75)">
      <!-- Torch base -->
      <path d="M 15,45 L 25,45 L 22,65 L 18,65 Z" fill="url(#goldGrad)"/>
      <path d="M 10,40 L 30,40 L 25,46 L 15,46 Z" fill="#D4A853"/>
      <!-- Flame -->
      <path d="M 20,10 C 28,22 32,28 28,38 C 24,34 22,33 20,38 C 18,33 16,34 12,38 C 8,28 12,22 20,10 Z" fill="#F59E0B"/>
      <path d="M 20,18 C 24,24 25,28 23,34 C 21,31 20,31 19,34 C 17,28 18,24 20,18 Z" fill="#FDE047"/>
    </g>

    <!-- Top Right: Open Book of Knowledge -->
    <g transform="translate(130, 52) scale(0.7)">
      <path d="M 10,45 C 25,38 42,40 50,48 C 58,40 75,38 90,45 L 90,20 C 75,13 58,15 50,23 C 42,15 25,13 10,20 Z" fill="url(#goldGrad)" opacity="0.95"/>
      <path d="M 50,23 L 50,48" stroke="#0B1B3D" stroke-width="2"/>
      <!-- Pages lines -->
      <line x1="20" y1="26" x2="42" y2="29" stroke="#0B1B3D" stroke-width="1.5"/>
      <line x1="20" y1="33" x2="42" y2="36" stroke="#0B1B3D" stroke-width="1.5"/>
      <line x1="58" y1="29" x2="80" y2="26" stroke="#0B1B3D" stroke-width="1.5"/>
      <line x1="58" y1="36" x2="80" y2="33" stroke="#0B1B3D" stroke-width="1.5"/>
    </g>

    <!-- Bottom Center: Rising Sun & Atom / Science orbit -->
    <g transform="translate(70, 135) scale(0.8)">
      <!-- Sun Rays -->
      <circle cx="50" cy="50" r="16" fill="url(#goldGrad)"/>
      <!-- Orbit rings -->
      <ellipse cx="50" cy="50" rx="35" ry="12" fill="none" stroke="#D4A853" stroke-width="1.5" transform="rotate(-25 50 50)"/>
      <ellipse cx="50" cy="50" rx="35" ry="12" fill="none" stroke="#D4A853" stroke-width="1.5" transform="rotate(35 50 50)"/>
      <circle cx="20" cy="38" r="3" fill="#60A5FA"/>
      <circle cx="78" cy="62" r="3" fill="#60A5FA"/>
    </g>

    <!-- Academic Stars above shield -->
    <g fill="url(#goldGrad)">
      <polygon points="110,0 114,9 123,9 116,15 119,24 110,18 101,24 104,15 97,9 106,9"/>
    </g>
  </g>

  <!-- Laurel Wreath Leaves (Left and Right) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <!-- Left Wreath -->
    <path d="M 95,250 C 95,310 130,365 190,395 C 185,385 180,370 178,355 C 135,330 110,290 110,250 Z"/>
    <ellipse cx="102" cy="270" rx="6" ry="14" transform="rotate(25 102 270)"/>
    <ellipse cx="118" cy="310" rx="6" ry="14" transform="rotate(40 118 310)"/>
    <ellipse cx="145" cy="345" rx="6" ry="14" transform="rotate(55 145 345)"/>
    <ellipse cx="178" cy="372" rx="6" ry="14" transform="rotate(70 178 372)"/>

    <!-- Right Wreath -->
    <path d="M 405,250 C 405,310 370,365 310,395 C 315,385 320,370 322,355 C 365,330 390,290 390,250 Z"/>
    <ellipse cx="398" cy="270" rx="6" ry="14" transform="rotate(-25 398 270)"/>
    <ellipse cx="382" cy="310" rx="6" ry="14" transform="rotate(-40 382 310)"/>
    <ellipse cx="355" cy="345" rx="6" ry="14" transform="rotate(-55 355 345)"/>
    <ellipse cx="322" cy="372" rx="6" ry="14" transform="rotate(-70 322 372)"/>
  </g>

  <!-- Motto Banner Ribbon -->
  <g transform="translate(100, 395)">
    <path d="M 30,25 L 270,25 L 250,55 L 50,55 Z" fill="#D4A853" filter="url(#shadow)"/>
    <path d="M 30,25 L 10,40 L 30,55 L 20,40 Z" fill="#9E7321"/>
    <path d="M 270,25 L 290,40 L 270,55 L 280,40 Z" fill="#9E7321"/>
    <rect x="35" y="27" width="230" height="26" fill="#102A43" rx="4"/>
    <text x="150" y="45" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#F5D061" text-anchor="middle" letter-spacing="2">
      VIDYA DADATI VINAYAM
    </text>
  </g>
</svg>
